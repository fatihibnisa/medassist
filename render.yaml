services:
  - type: web
    name: medassist
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: DATA_DIR
        value: ./data
      - key: DEMO_SEED
        value: "true"
      - key: SMS_PROVIDER
        value: console
      - key: ADMIN_PHONE
        value: "998901234567"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Administrator
