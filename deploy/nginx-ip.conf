# /etc/nginx/sites-available/medassist  — domensiz, faqat IP orqali (HTTP, sinov uchun)
# Domen olganingizdan keyin deploy/nginx.conf ga o‘ting va HTTPS yoqing.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 12m;   # fayl yuklash 10 MB gacha
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot spoof their IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
