# /etc/nginx/sites-available/medassist  — domeningizni almashtiring
server {
    listen 80;
    server_name medassist.uz www.medassist.uz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name medassist.uz www.medassist.uz;

    ssl_certificate     /etc/letsencrypt/live/medassist.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medassist.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;   # fayl yuklash 10 MB gacha
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot spoof their IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
